<style>

    color-scheme:dark;
    --bg:#111513; --surface:#1A1F1C; --sunk:#232925; --ink:#E6EBE8; --muted:#9AA6A0; --line:#2E3632;
    --accent:#72B4E2; --accent-soft:#1B3445; --accent-ink:#08161F;
    --sheet:#3A3122; --wood:#8A6E42; --wood-edge:#D2AC6E; --wood-ink:#FFF5E2; --grain:#6E5836;
    --trim:#E47B62; --warn:#E5B062; --warn-soft:#3A2E1A; --err:#F28B82; --err-soft:#3E1F1C; --ok:#7CC897;
  }
}

  --accent:#72B4E2; --accent-soft:#1B3445; --accent-ink:#08161F;
  --sheet:#3A3122; --wood:#8A6E42; --wood-edge:#D2AC6E; --wood-ink:#FFF5E2; --grain:#6E5836;
  --trim:#E47B62; --warn:#E5B062; --warn-soft:#3A2E1A; --err:#F28B82; --err-soft:#3E1F1C; --ok:#7CC897;

/* 木取り */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:9px;padding:3px;gap:3px}

/* フォーム */
.field{display:flex;flex-direction:column;gap:4px}

input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
input.mono{font-family:var(--mono)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* シート */
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}

.sheetpanel h3{margin:0 0 12px;font-size:18px}

@media (prefers-reduced-motion:no-preference){.sheetpanel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

<div class="app">
  <header class="top">
    <div style="min-width:0;flex:1">
      <div class="brand">KIDORI · 木取り</div>
      <h1 id="jobTitle"></h1>
    </div>
    <span class="badge">試作・見本データ</span>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="画面の切り替え"><div class="in" id="tabs"></div></nav>
<div id="sheet"></div>

<script>
const TABS=[['jobs','仕事'],['parts','部材'],['table','寸法表'],['cut','木取り'],['settings','設定']];
const PRESETS={saburoku:{label:'サブロク 910×1820',S:910,L:1820},shihachi:{label:'シハチ 1220×2440',S:1220,L:2440},free:{label:'自由入力'}};
const MODES=[['vertical','縦切り優先'],['horizontal','横切り優先'],['auto','おまかせ']];
const AX=['W','H','D'];
const KEY='kidori-proto-v1';

const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=v=>Math.round(v*10)/10;
const fmt=v=>{v=r1(v);return Number.isInteger(v)?String(v):v.toFixed(1)};
const today=()=>new Date().toISOString().slice(0,10);

function sampleJob(){
  return {id:uid(),name:'本棚 W900（見本）',updated:today(),
    settings:{kerf:3,trim:5,allowance:10,mode:'vertical'},
    boards:[
      {id:'b1',name:'シナランバー',t:18,preset:'saburoku',S:910,L:1820,grain:'long'},
      {id:'b2',name:'シナベニヤ',t:4,preset:'saburoku',S:910,L:1820,grain:'long'}],
    parts:[
      {id:uid(),name:'全体',board:'',W:'900',H:'1800',D:'400',qty:0,thick:'auto',grain:'any',nige:{},allow:''},
      {id:uid(),name:'側板',board:'b1',W:'18',H:'全体.H',D:'全体.D',qty:2,thick:'auto',grain:'H',nige:{},allow:''},
      {id:uid(),name:'天地板',board:'b1',W:'全体.W - 側板.W * 2',H:'18',D:'全体.D',qty:2,thick:'auto',grain:'W',nige:{},allow:''},
      {id:uid(),name:'棚板',board:'b1',W:'天地板.W',H:'18',D:'全体.D - 20',qty:4,thick:'auto',grain:'W',nige:{W:1},allow:''},
      {id:uid(),name:'背板',board:'b2',W:'全体.W',H:'全体.H',D:'4',qty:1,thick:'auto',grain:'H',nige:{},allow:'0'}]};
}
function blankJob(){
  const j=sampleJob();
  return {...j,id:uid(),name:'新しい仕事',parts:[{id:uid(),name:'全体',board:'',W:'900',H:'720',D:'600',qty:0,thick:'auto',grain:'any',nige:{},allow:''}]};
}

let state=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.jobs&&s.jobs.length)return s}catch(e){}
  return {jobs:[sampleJob()],cur:0,tab:'parts'};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const job=()=>state.jobs[state.cur];
function touch(){job().updated=today();save();render()}

/* ---------- 式 ---------- */
function tokenize(src){
  src=String(src).normalize('NFKC').replace(/[×✕]/g,'*').replace(/÷/g,'/').replace(/[−–—]/g,'-');
  const t=[];let i=0;
  while(i<src.length){
    const c=src[i];
    if(/\s/.test(c)){i++;continue}
    if('+-*/()'.includes(c)){t.push({k:'op',v:c});i++;continue}
    if(/[0-9.]/.test(c)){let j=i;while(j<src.length&&/[0-9.]/.test(src[j]))j++;const n=Number(src.slice(i,j));if(isNaN(n))throw new Error('数値「'+src.slice(i,j)+'」が読めません');t.push({k:'num',v:n});i=j;continue}
    let j=i;while(j<src.length&&!/[\s+\-*/()]/.test(src[j]))j++;
    const w=src.slice(i,j),m=w.match(/^(.+)\.([WHDwhd])$/);
    if(!m)throw new Error('「'+w+'」は「部材名.W」のように書いてください');
    t.push({k:'ref',name:m[1],ax:m[2].toUpperCase()});i=j;
  }
  return t;
}
function evalExpr(src,ref){
  const t=tokenize(src);let p=0;
  if(!t.length)throw new Error('値が入っていません');
  const peek=()=>t[p],take=()=>t[p++];
  const isOp=s=>peek()&&peek().k==='op'&&s.includes(peek().v);
  function expr(){let v=term();while(isOp('+-')){const o=take().v,r=term();v=o==='+'?v+r:v-r}return v}
  function term(){let v=factor();while(isOp('*/')){const o=take().v,r=factor();if(o==='/'&&r===0)throw new Error('0で割っています');v=o==='*'?v*r:v/r}return v}
  function factor(){const x=take();if(!x)throw new Error('式が途中で終わっています');
    if(x.k==='num')return x.v;if(x.k==='ref')return ref(x.name,x.ax);
    if(x.v==='-')return -factor();
    if(x.v==='('){const v=expr(),y=take();if(!y||y.v!==')')throw new Error('「)」が足りません');return v}
    throw new Error('「'+x.v+'」の位置がおかしいです')}
  const v=expr();if(p<t.length)throw new Error('式の終わりに余分なものがあります');return v;
}

/* ---------- 寸法の計算 ---------- */
function compute(j){
  const byName=new Map(j.parts.map(p=>[p.name.trim(),p]));
  const memo=new Map(),visiting=new Set();
  function fin(p,ax){
    const key=p.id+ax;
    if(memo.has(key)){const m=memo.get(key);if('v' in m)return m.v;throw new Error('参照先「'+p.name+'.'+ax+'」が計算できません')}
    if(visiting.has(key))throw new Error('循環参照になっています（「'+p.name+'.'+ax+'」が自分に戻ってきます）');
    visiting.add(key);
    try{
      const raw=evalExpr(p[ax],(n,a)=>{const q=byName.get(n);if(!q)throw new Error('「'+n+'」という部材はありません');return fin(q,a)});
      const v=r1(raw-(Number(p.nige?.[ax])||0));
      if(!(v>0))throw new Error('計算結果が0以下です（'+fmt(v)+'）');
      memo.set(key,{v});return v;
    }catch(e){if(!memo.has(key))memo.set(key,{err:e.message});throw e}
    finally{visiting.delete(key)}
  }
  return j.parts.map(p=>{
    const vals={},errs={};
    AX.forEach(a=>{try{vals[a]=fin(p,a)}catch(e){errs[a]=memo.get(p.id+a)?.err||e.message}});
    const board=j.boards.find(b=>b.id===p.board)||null;
    const warns=[];let thick=p.thick,thickAuto=false;
    const ok=!Object.keys(errs).length;
    if(ok&&thick==='auto'){
      thickAuto=true;
      const hits=board?AX.filter(a=>vals[a]===board.t):[];
      if(hits.length)thick=hits[0];
      else{thick=AX.reduce((m,a)=>vals[a]<vals[m]?a:m,'W');if(board&&p.qty>0)warns.push('材料の厚み '+board.t+'mm と同じ寸法がありません。一番小さい '+thick+' を厚みとして扱っています')}
    }else if(ok&&board&&p.qty>0&&vals[thick]!==board.t){warns.push('厚みの寸法 '+thick+'='+fmt(vals[thick])+' が材料の厚み '+board.t+'mm と違います')}
    if(thick==='auto')thick='H';
    const faces=AX.filter(a=>a!==thick);
    const allow=p.allow===''||p.allow==null?j.settings.allowance:Number(p.allow)||0;
    const cut={};if(ok)faces.forEach(a=>cut[a]=r1(vals[a]+allow));
    let grain=p.grain;
    if(grain!=='any'&&!faces.includes(grain)){if(p.qty>0)warns.push('木目の '+grain+'方向 は厚みの寸法なので、どちらでもよいとして扱っています');grain='any'}
    if(p.qty>0&&!board)warns.push('板が選ばれていません');
    return {p,vals,errs,ok,thick,thickAuto,faces,allow,cut,grain,board,warns};
  });
}

/* ---------- 木取り（ギロチン・帯詰め） ---------- */
function packCols(items,W,H,k){
  const boards=[],unplaced=[];
  items.sort((a,b)=>Math.min(...b.opts.map(o=>o.w))-Math.min(...a.opts.map(o=>o.w))||Math.max(...b.opts.map(o=>o.h))-Math.max(...a.opts.map(o=>o.h)));
  for(const it of items){
    let best=null;
    for(const bd of boards)for(const c of bd.cols)for(const o of it.opts){
      if(o.w<=c.w&&c.y+o.h<=H){const waste=c.w-o.w;if(!best||waste<best.waste)best={c,o,waste}}
    }
    if(best){best.c.items.push({...best.o,name:it.name,x:best.c.x,y:best.c.y});best.c.y+=best.o.h+k;continue}
    let nb=null;
    for(const bd of boards){for(const o of [...it.opts].sort((a,b)=>a.w-b.w))if(bd.usedW+o.w<=W&&o.h<=H){nb={bd,o};break}if(nb)break}
    if(!nb){const o=[...it.opts].sort((a,b)=>a.w-b.w).find(o=>o.w<=W&&o.h<=H);if(!o){unplaced.push(it.name);continue}const bd={cols:[],usedW:0};boards.push(bd);nb={bd,o}}
    const c={x:nb.bd.usedW,w:nb.o.w,y:0,items:[]};nb.bd.cols.push(c);nb.bd.usedW+=nb.o.w+k;
    c.items.push({...nb.o,name:it.name,x:c.x,y:0});c.y=nb.o.h+k;
  }
  return {boards,unplaced};
}
function layout(group,mode,s){
  const b=group.board,k=s.kerf,trim=s.trim;
  const gv=b.grain==='long';
  const items=[];
  group.parts.forEach(r=>{
    const [A,B]=r.faces,a=r.cut[A],bb=r.cut[B];let opts;
    if(r.grain==='any')opts=a===bb?[{w:a,h:bb}]:[{w:a,h:bb},{w:bb,h:a}];
    else{const g=r.cut[r.grain],o=r.grain===A?bb:a;opts=[gv?{w:o,h:g}:{w:g,h:o}]}
    for(let i=0;i<r.p.qty;i++)items.push({name:r.p.name,opts});
  });
  const tr=mode==='horizontal';
  const W0=b.S-trim,H0=b.L;
  const W=tr?H0:W0,H=tr?W0:H0;
  const its=tr?items.map(it=>({...it,opts:it.opts.map(o=>({w:o.h,h:o.w}))})):items;
  const res=packCols(its,W,H,k);
  const map=r=>tr?{x:r.y,y:r.x,w:r.h,h:r.w}:r;
  const P=tr?'横切り':'縦切り',Q=tr?'縦切り':'横切り';
  const boards=res.boards.map(bd=>{
    const pieces=[],scraps=[],steps=[{kind:'t',t:'耳落とし',d:'右側の長辺を '+trim+'mm 落とす'}];
    bd.cols.forEach((c,ci)=>{
      steps.push({kind:'p',t:P,d:'帯'+(ci+1)+'：幅 '+fmt(c.w)+'mm で切り出す'});
      c.items.forEach(it=>{
        pieces.push({...map(it),name:it.name});
        steps.push({kind:'q',t:Q,d:'帯'+(ci+1)+' から 長さ '+fmt(it.h)+'mm → '+it.name});
        if(it.w<c.w){steps.push({kind:'p',t:P,d:it.name+' の幅を '+fmt(it.w)+'mm に揃える'});const sw=c.w-it.w-k;if(sw>=30&&it.h>=30)scraps.push(map({x:it.x+it.w+k,y:it.y,w:sw,h:it.h}))}
      });
      const rest=H-c.y;if(rest>=30&&c.w>=30)scraps.push(map({x:c.x,y:c.y,w:c.w,h:rest}));
    });
    const rw=W-bd.usedW;if(rw>=30)scraps.push(map({x:bd.usedW,y:0,w:rw,h:H}));
    const area=pieces.reduce((s,p)=>s+p.w*p.h,0);
    return {pieces,scraps:scraps.sort((a,b)=>b.w*b.h-a.w*a.h),steps,yield:area/(b.S*b.L),area};
  });
  const total=boards.reduce((s,x)=>s+x.area,0);
  return {mode,boards,unplaced:res.unplaced,yield:boards.length?total/(boards.length*b.S*b.L):0,
    bestScrap:Math.max(0,...boards.flatMap(x=>x.scraps.map(s=>s.w*s.h)))};
}
function solve(group,s){
  if(s.mode!=='auto')return layout(group,s.mode,s);
  const v=layout(group,'vertical',s),h=layout(group,'horizontal',s);
  const pick=(h.unplaced.length<v.unplaced.length)||(h.unplaced.length===v.unplaced.length&&(h.boards.length<v.boards.length||(h.boards.length===v.boards.length&&h.bestScrap>v.bestScrap)))?h:v;
  return {...pick,auto:true};
}

function vTable(rows){

function boardSVG(b,L,trim){
  const S=b.S,Lb=b.L,pad=6;
  const gv=b.grain==='long';
  let grain='';const n=Math.round((gv?S:Lb)/38);
  for(let i=1;i<n;i++){const t=i*(gv?S:Lb)/n;grain+=gv?`<line class="grainln" x1="${t}" y1="0" x2="${t+((i%3)-1)*14}" y2="${Lb}"/>`:`<line class="grainln" x1="0" y1="${t}" x2="${S}" y2="${t+((i%3)-1)*14}"/>`}
  const txt=(x,y,w,h,a,bb,cls)=>{
    const fs=Math.max(22,Math.min(64,Math.min(w,h)/4.2));
    const len=Math.max(a.length*fs,bb.length*fs*.62);
    const rot=len>w*.92&&h>w;
    const cx=x+w/2,cy=y+h/2,tf=rot?` transform="rotate(-90 ${cx} ${cy})"`:'';
    if(rot&&len>h*.92)return'';
    if(!rot&&len>w*.92)return'';
    return `<g${tf}><text x="${cx}" y="${cy-fs*.62}" font-size="${fs}" font-weight="700" class="${cls||''}">${esc(a)}</text><text x="${cx}" y="${cy+fs*.62}" font-size="${fs*.82}" class="dm ${cls||''}">${bb}</text></g>`;
  };
  return `<svg class="boardsvg" viewBox="${-pad} ${-pad} ${S+pad*2} ${Lb+pad*2}" role="img" aria-label="板の配置図">
    <rect class="sheet" x="0" y="0" width="${S}" height="${Lb}"/>${grain}
    <rect class="trim" x="${S-trim}" y="0" width="${trim}" height="${Lb}"/>
    ${L.scraps.map(s=>`<rect class="scrap" x="${s.x+4}" y="${s.y+4}" width="${Math.max(0,s.w-8)}" height="${Math.max(0,s.h-8)}"/>${txt(s.x,s.y,s.w,s.h,'端材',fmt(s.w)+'×'+fmt(s.h),'sc')}`).join('')}
    ${L.pieces.map(p=>`<rect class="pc" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"/>${txt(p.x,p.y,p.w,p.h,p.name,fmt(p.w)+'×'+fmt(p.h))}`).join('')}
    <rect class="outline" x="0" y="0" width="${S}" height="${Lb}"/></svg>`;
}

function vCut(rows){
  const s=job().settings;
  const groups=job().boards.map(b=>({board:b,parts:rows.filter(r=>r.board===b&&r.p.qty>0&&r.ok)})).filter(g=>g.parts.length);
  const broken=rows.filter(r=>r.p.qty>0&&(!r.ok||!r.board));
  let html=`<h2>木取り</h2><p class="lead">刃厚 ${s.kerf}mm・耳落とし ${s.trim}mm（右側の長辺）・切り代 初期値 ${s.allowance}mm で計算しています。</p>
  <div class="seg" role="group" aria-label="切り方">${MODES.map(([m,l])=>`<button data-mode="${m}" aria-pressed="${s.mode===m}">${l}</button>`).join('')}</div>`;
  if(broken.length)html+=`<div class="msg err">計算に入れていない部材：${broken.map(r=>esc(r.p.name)).join('、')}（部材の画面でエラーを直してください）</div>`;
  groups.forEach(g=>{
    const L=solve(g,s),b=g.board;
    const nPieces=g.parts.reduce((t,r)=>t+r.p.qty,0);
    html+=`<section class="mat"><h3>${boardLabel(b)} <small>${b.preset==='free'?'自由 '+b.S+'×'+b.L:PRESETS[b.preset].label}・部材 ${nPieces}枚</small></h3>
      <div class="stats"><div class="stat"><div class="k">必要な板</div><div class="v">${L.boards.length}<small> 枚</small></div></div>
      <div class="stat"><div class="k">歩留まり</div><div class="v">${(L.yield*100).toFixed(1)}<small> %</small></div></div>
      <div class="stat"><div class="k">切り方</div><div class="v" style="font-size:14px;font-family:var(--sans);padding-top:4px">${MODES.find(m=>m[0]===L.mode)[1]}${L.auto?'<br><small>おまかせで採用</small>':''}</div></div></div>
      ${L.unplaced.length?`<div class="msg err">板に入らない部材：${[...new Set(L.unplaced)].map(esc).join('、')}（寸法・木目・板のサイズを確認してください）</div>`:''}
      ${L.boards.map((bd,i)=>`<div class="boardcard"><div class="hd"><b>${i+1}枚目</b><span>歩留まり <span class="num">${(bd.yield*100).toFixed(1)}%</span></span></div>
        ${boardSVG(b,bd,s.trim)}
        <details><summary>切る順番（${bd.steps.length}工程）</summary><ol class="steps">${bd.steps.map(st=>`<li><span class="kind ${st.kind==='t'?'t':st.kind==='q'?'s':''}">${st.t}</span><span>${esc(st.d)}</span></li>`).join('')}</ol></details>
        <details><summary>端材（${bd.scraps.length}個）</summary><div class="scraps">${bd.scraps.length?bd.scraps.map(x=>`<span class="chip mono">${fmt(x.w)} × ${fmt(x.h)}</span>`).join(''):'<span class="chip">30mm以上の端材はありません</span>'}</div></details>
      </div>`).join('')}</section>`;
  });
  html+=`<div class="legend"><span><i style="background:var(--wood)"></i>部材</span><span><i style="border:1px dashed var(--muted)"></i>端材</span><span><i style="background:var(--trim);opacity:.55"></i>耳落とし</span><span><i style="background:var(--sheet);border:1px solid var(--grain)"></i>板（線は木目）</span></div>`;
  return html;
}

function preview(){
  const j=job(),d=draft;
  const parts=j.parts.some(p=>p.id===d.id)?j.parts.map(p=>p.id===d.id?d:p):[...j.parts,d];
  const r=compute({...j,parts}).find(x=>x.p.id===d.id);
  const pv=document.getElementById('pv');if(!pv)return;
  AX.forEach(a=>{const g=document.querySelector(`#f-grain option[value="${a}"]`);if(g)g.disabled=r.ok&&a===r.thick;const n=document.getElementById('f-n'+a);if(n)n.disabled=r.ok&&a===r.thick});
  const e=Object.entries(r.errs);
  pv.innerHTML=e.length?e.map(([a,m])=>`<div style="color:var(--err)">${a}：${esc(m)}</div>`).join('')
    :`仕上がり <span class="mono">${AX.map(a=>a+' '+fmt(r.vals[a])).join('  ')}</span><br>厚み <b>${r.thick}</b>${r.thickAuto?'（自動）':''}${d.qty>0?`　木取り <span class="mono">${r.faces.map(a=>a+' '+fmt(r.cut[a])).join(' × ')}</span>`:''}`

}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-open],[data-edit],[data-act],[data-mode],[data-allow]');if(!t)return;
  if(t.dataset.act==='close'&&t.classList.contains('overlay')&&e.target!==t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;save();render();window.scrollTo(0,0);return}
  if(t.dataset.open){state.cur=+t.dataset.open;state.tab='parts';save();render();return}
  if(t.dataset.edit){openSheet(t.dataset.edit);return}
  if(t.dataset.mode){job().settings.mode=t.dataset.mode;touch();return}
  if(t.dataset.allow){job().settings.allowance=+t.dataset.allow;touch();return}
  const a=t.dataset.act,j=job();
  if(a==='addpart')openSheet(null);
  else if(a==='close')closeSheet();
  else if(a==='savepart'){const d=draft;delete d._new;d.qty=Math.max(0,parseInt(d.qty)||0);const i=j.parts.findIndex(p=>p.id===d.id);if(i>=0)j.parts[i]=d;else j.parts.push(d);closeSheet();touch()}
  else if(a==='del'){if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='本当に削除';return}j.parts=j.parts.filter(p=>p.id!==draft.id);closeSheet();touch()}
  else if(a==='newjob'){state.jobs.push(blankJob());state.cur=state.jobs.length-1;state.tab='parts';touch()}
  else if(a==='addboard'){j.boards.push({id:uid(),name:'新しい板',t:18,preset:'saburoku',S:910,L:1820,grain:'long'});touch()}
  else if(a==='reset'){if(!t.classList.contains('armed')){t.classList.add('armed','danger');t.textContent='もう一度押すと、すべての仕事を消して見本に戻します';return}state={jobs:[sampleJob()],cur:0,tab:'parts'};save();render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(draft&&t.dataset.f){draft[t.dataset.f]=t.value;preview();return}
  if(draft&&t.dataset.n){draft.nige={...draft.nige,[t.dataset.n]:t.value===''?0:Number(t.value)};preview();return}
});
document.addEventListener('change',e=>{
  const t=e.target,j=job();
  if(t.dataset.set){const k=t.dataset.set;if(k==='name'){j.name=t.value||'名前なし'}else{const v=Number(t.value);if(t.value===''||isNaN(v))return;j.settings[k]=v}touch();return}
  if(t.dataset.b){const b=j.boards.find(x=>x.id===t.dataset.b),k=t.dataset.k;
    if(k==='name')b.name=t.value;else if(k==='grain')b.grain=t.value;
    else if(k==='preset'){b.preset=t.value;if(t.value!=='free'){b.S=PRESETS[t.value].S;b.L=PRESETS[t.value].L;b.grain='long'}}
    else{const v=Number(t.value);if(v>0)b[k]=v;if(b.S>b.L)[b.S,b.L]=[b.L,b.S]}
    touch();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&draft)closeSheet()});
render();
</script>
